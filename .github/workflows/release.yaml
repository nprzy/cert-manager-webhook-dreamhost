# Workflow originally from:
# https://docs.github.com/en/actions/use-cases-and-examples/publishing-packages/publishing-docker-images#publishing-images-to-github-packages

name: Build and Release

# Configures this workflow to run every time a change is pushed to the branch called `release`.
on:
  push:
    branches:
      - 'master'
    tags:
      - 'v*'
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - 'master'

# Defines two custom environment variables for the workflow. These are used for the Container registry domain, and a name for the Docker image that this workflow builds.
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: test coverage
        run: make coverage-report

      - name: upload coverage profile artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage.out
          path: _test/coverage.out
          if-no-files-found: error

      - name: upload coverage HTML report
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage.html
          path: _test/test-coverage.html
          if-no-files-found: error

      - name: download breakdown artifact
        id: download-breakdown
        uses: dawidd6/action-download-artifact@v9
        with:
          branch: master
          workflow_conclusion: success
          name: breakdown
          if_no_artifact_found: ignore

      - name: check test coverage
        id: coverage
        uses: vladopajic/go-test-coverage@v2
        continue-on-error: true # Should fail after coverage comment is posted
        with:
          config: ./.testcoverage.yml
          diff-base-breakdown-file-name: ${{ steps.download-breakdown.outputs.found_artifact == 'true' && 'breakdown' || '' }}

      - name: upload new breakdown artifact
        uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'push' && github.ref_name == 'master' }}
        with:
          name: breakdown
          path: _test/breakdown
          if-no-files-found: ignore

      - name: write coverage summary
        run: |
          echo "go-test-coverage report:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '${{ fromJSON(steps.coverage.outputs.report) }}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: post coverage report
        if: ${{ github.event_name == 'pull_request' }}
        uses: thollander/actions-comment-pull-request@v3
        with:
          comment-tag: coverage-report
          message: |
            go-test-coverage report:
            ```
            ${{ fromJSON(steps.coverage.outputs.report) }}```

      - name: download previous helm chart
        id: download-helm-chart
        uses: dawidd6/action-download-artifact@v9
        with:
          branch: master
          workflow_conclusion: success
          name: rendered-manifest.yaml
          if_no_artifact_found: ignore

      - name: test render helm chart
        run: make rendered-manifest.yaml

      - name: diff new and old rendered-manifest.yaml
        if: ${{ steps.download-helm-chart.outputs.found_artifact == 'true' }}
        run: diff -Nau rendered-manifest.yaml _out/rendered-manifest.yaml > _test/rendered-manifest.yaml.diff

      - name: upload rendered-manifest.yaml diff
        if: ${{ steps.download-helm-chart.outputs.found_artifact == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: rendered-manifest.yaml.diff
          path: _test/rendered-manifest.yaml.diff
          if-no-files-found: ignore

      - name: upload rendered-manifest.yaml artifact
        uses: actions/upload-artifact@v4
        with:
          name: rendered-manifest.yaml
          path: _out/rendered-manifest.yaml
          if-no-files-found: ignore

      - name: assert sufficient coverage
        if: steps.coverage.outcome == 'failure'
        shell: bash
        run: echo "coverage check failed" && exit 1

  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    needs: ['test']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      # Uses the `docker/login-action` action to log in to the Container registry registry using the account and password that will publish the packages. Once published, the packages are scoped to the account defined here.
      - name: Log in to the Container registry
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # This step uses [docker/metadata-action](https://github.com/docker/metadata-action#about) to extract tags and labels that will be applied to the specified image. The `id` "meta" allows the output of this step to be referenced in a subsequent step. The `images` value provides the base name for the tags and labels.
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
      # This step uses the `docker/build-push-action` action to build the image, based on your repository's `Dockerfile`. If the build succeeds, it pushes the image to GitHub Packages.
      # It uses the `context` parameter to define the build's context as the set of files located in the specified path. For more information, see [Usage](https://github.com/docker/build-push-action#usage) in the README of the `docker/build-push-action` repository.
      # It uses the `tags` and `labels` parameters to tag and label the image with the output from the "meta" step.
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # This step generates an artifact attestation for the image, which is an unforgeable statement about where and how it was built. It increases supply chain security for people who consume the image. For more information, see [Using artifact attestations to establish provenance for builds](/actions/security-guides/using-artifact-attestations-to-establish-provenance-for-builds).
      - name: Generate artifact attestation
        if: ${{ github.event_name == 'push' }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
  release-chart:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: ['build-and-push-image']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: deploy
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
