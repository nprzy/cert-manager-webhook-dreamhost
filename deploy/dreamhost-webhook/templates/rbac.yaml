apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dreamhost-webhook.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "dreamhost-webhook.labels" . | nindent 4 }}
---
# Grant the webhook permission to read the ConfigMap containing the Kubernetes
# apiserver's requestheader-ca-certificate.
# This ConfigMap is automatically created by the Kubernetes apiserver.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dreamhost-webhook.fullname" . }}:webhook-authentication-reader
  namespace: kube-system
  labels:
    {{- include "dreamhost-webhook.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ include "dreamhost-webhook.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
# apiserver gets the auth-delegator role to delegate auth decisions to
# the core apiserver
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dreamhost-webhook.fullname" . }}:auth-delegator
  labels:
    {{- include "dreamhost-webhook.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ include "dreamhost-webhook.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
# Create a role that grants webhook-dreamhost permission to the
# resources it needs to function.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "dreamhost-webhook.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "dreamhost-webhook.labels" . | nindent 4 }}
rules:
- apiGroups:
    - ''
  resources:
    - 'secrets'
  {{- if .Values.secretResourceName }}
  resourceNames:
    - {{ .Values.secretResourceName | quote }}
  {{- end }}
  verbs:
    - 'get'
---
# Bind the above webhook-dreamhost role to the service account
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dreamhost-webhook.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "dreamhost-webhook.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "dreamhost-webhook.fullname" . }}
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ include "dreamhost-webhook.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
# Grant cert-manager permission to validate using our apiserver
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dreamhost-webhook.fullname" . }}:domain-solver
  labels:
    {{- include "dreamhost-webhook.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - {{ .Values.groupName }}
    resources:
      - '*'
    verbs:
      - 'create'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dreamhost-webhook.fullname" . }}:domain-solver
  labels:
    {{- include "dreamhost-webhook.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "dreamhost-webhook.fullname" . }}:domain-solver
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: {{ .Values.certManager.serviceAccountName }}
    namespace: {{ .Values.certManager.namespace }}
